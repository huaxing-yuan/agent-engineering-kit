name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Framework tests
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q aeng
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify wheel templates
        run: python tools/verify_wheel.py dist
      - name: Governance check
        run: aeng check
      - name: Documentation check
        run: aeng docs check
      - name: Pulse preview
        run: aeng pulse
      - name: Sample governance check
        run: aeng --root examples/sample-app check
      - name: Sample documentation check
        run: aeng --root examples/sample-app docs check
      - name: Sample tests
        run: python -m unittest discover -s examples/sample-app/tests -v
