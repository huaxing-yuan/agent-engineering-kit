name: pulse

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Generate pulse artifact
        run: aeng pulse --write
      - name: Upload pulse
        uses: actions/upload-artifact@v4
        with:
          name: engineering-pulse
          path: engineering/pulse/
